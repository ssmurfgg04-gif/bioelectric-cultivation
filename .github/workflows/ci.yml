name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests (coding, dynamics, information layers)
        run: python -m tests.run_tests
      - name: Codegraph structure snapshot
        run: |
          python tools/codegraph.py . --json results/codegraph.json --dot results/codegraph.dot
          cat results/codegraph.json | head -40

  falsification:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Full falsification suite (experiments 1-6, Level 1-2 checks)
        run: python -m tests.run_tests --full
        timeout-minutes: 40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: falsification-results
          path: |
            results/*.json
            results/figures/*.png
