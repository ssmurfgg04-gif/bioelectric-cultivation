[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bioelectric-cultivation"
version = "0.2.0"
description = "Simulation toolkit for bioelectric pattern memory, aging-as-degradation and inverse design of bioelectric interventions"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
  "networkx>=3.0",
  "pandas>=2.0",
]

[tool.setuptools.packages.find]
include = ["cultivation*", "human*"]
